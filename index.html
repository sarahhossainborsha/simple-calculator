<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calculator">

        <input type="text" id="display" readonly>

        <div class="buttons">

            <button onclick="clearDisplay()"class="delete-btn">C</button>
            <button onclick="deleteLast()" class="delete-btn">DEL</button>
            <button onclick="addValue('/')">/</button>
            <button onclick="addValue('*')">*</button>

            <button onclick="addValue('7')" class="digit-btn">7</button>
            <button onclick="addValue('8')" class="digit-btn">8</button>
            <button onclick="addValue('9')" class="digit-btn">9</button>
            <button onclick="addValue('-')">-</button>

            <button onclick="addValue('4')" class="digit-btn">4</button>
            <button onclick="addValue('5')" class="digit-btn">5</button>
            <button onclick="addValue('6')" class="digit-btn">6</button>
            <button onclick="addValue('+')">+</button>

            <button onclick="addValue('1')" class="digit-btn">1</button>
            <button onclick="addValue('2')" class="digit-btn">2</button>
            <button onclick="addValue('3')" class="digit-btn">3</button>
            <button onclick="calculate()">=</button>

            <button onclick="addValue('0')" class="digit-btn zero">0</button>
            <button onclick="addValue('.')">.</button>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
